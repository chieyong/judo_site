[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Basisbeveiliging voor alle pagina's
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Robots-Tag = "noindex"

# Het beheerscherm nooit uit de cache halen, zodat config-wijzigingen direct zichtbaar zijn
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

# Oude adressen van de trainerspagina doorsturen naar de teampagina
[[redirects]]
  from = "/trainers/*"
  to = "/team/"
  status = 301

[[redirects]]
  from = "/en/for-coaches/*"
  to = "/en/team/"
  status = 301

# Oude adressen na de nieuwe indeling (Beginnen met judo / Talentprogramma)
[[redirects]]
  from = "/voor-ouders/*"
  to = "/talentprogramma/"
  status = 301

[[redirects]]
  from = "/waarom-judo/*"
  to = "/beginnen-met-judo/"
  status = 301

[[redirects]]
  from = "/en/for-parents/*"
  to = "/en/talent-programme/"
  status = 301

[[redirects]]
  from = "/en/why-judo/*"
  to = "/en/getting-started/"
  status = 301
